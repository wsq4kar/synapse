name: Ошибка / Bug
description: Что-то работает не так / Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Что случилось / What happened
      description: Что вы делали, что ожидали и что получили. Скриншот очень помогает.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия Synapse / Synapse version
      placeholder: 0.1.10
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Исполнитель / Executor
      options: [Gemini API, Claude Code, Codex, Gemini CLI, OpenCode, Не знаю / Not sure]
  - type: input
    id: os
    attributes:
      label: Windows
      placeholder: Windows 11 23H2
  - type: textarea
    id: log
    attributes:
      label: Текст ошибки / Error text
      description: Из карточки ответа или из «Настройки → Журнал». Уберите ключи и личные данные.
      render: text
